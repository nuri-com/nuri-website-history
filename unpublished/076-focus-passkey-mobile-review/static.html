.container { position: relative; z-index: 1; width: 100%; max-width: 400px; margin: 0px auto; flex: 1 1 0%; display: flex; flex-direction: column; padding-top: 20px; transition: transform 0.3s; }
.top-section { margin-bottom: 28px; }
.button-section { margin-top: auto; padding-bottom: 15px; }
.input-field-wrapper { width: 100%; margin-bottom: 18px; }
.input-field-card { position: relative; background: rgb(229, 229, 232); border-radius: 4px 4px 0px 0px; padding: 6px 16px 8px; min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.input-field-wrapper.focused .input-field-card { background: rgb(255, 255, 255); }
.input-field-wrapper.focused .input-field-input { color: rgba(0, 0, 0, 0.87); }
.input-field-label { position: absolute; top: 7px; left: 16px; font-size: 12px; font-weight: 500; letter-spacing: 0.4px; color: rgb(110, 158, 150); pointer-events: none; transition: color 0.2s, opacity 0.2s, transform 0.2s; opacity: 1; transform: translateY(7px); }
.input-field-input { padding: 21px 0px 6px; font-size: 16px; letter-spacing: 0.15px; color: rgb(149, 145, 150); border-width: medium; border-style: none; border-color: currentcolor; border-image: none; background: transparent; width: 100%; flex: 1 1 0%; min-width: 0px; outline: none; font-family: inherit; }
.input-field-input::placeholder { color: rgb(149, 145, 150); }
.input-field-check { width: 24px; height: 24px; flex-shrink: 0; display: none; }
.input-field-indicator { height: 1px; width: 100%; background: rgb(202, 201, 207); transition: background 0.2s; }
.input-field-wrapper.focused .input-field-label { color: rgb(110, 158, 150); transform: translateY(-3px); }
.input-field-wrapper.valid .input-field-label { color: rgb(110, 158, 150); transform: translateY(-3px); }
.input-field-wrapper.valid .input-field-input { color: rgba(0, 0, 0, 0.87); }
.input-field-wrapper.valid .input-field-check { display: block; }
.input-field-wrapper.valid .input-field-indicator { background: rgb(110, 158, 150); }
.input-field-wrapper.focused:not(.valid) .input-field-indicator { background: rgba(44, 35, 46, 0.4); }
.create-button span { line-height: 1; }
.focus-overlay { position: absolute; inset: 0px; background: rgba(212, 210, 210, 0.9); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 0; }
.signup-focus .focus-overlay { opacity: 1; pointer-events: none; }
.signup-focus .top-section, .signup-focus .logo-ticker, .signup-focus .logo-strip { opacity: 0; pointer-events: none; }
.signup-focus .container { justify-content: flex-end; }
.button-row { position: relative; }
.signup-focus .button-row { gap: 0px; }
.button-row .create-button { max-width: 100%; }
.login-button { transition: opacity 0.3s, transform 0.3s, max-width 0.3s, padding 0.3s; }
.register-button { transition: opacity 0.3s, transform 0.3s, flex 0.3s, max-width 0.3s; }
.signup-focus .button-row .login-button { opacity: 0; transform: translateX(-32px); pointer-events: none; max-width: 0px; padding-left: 0px; padding-right: 0px; }
.signup-focus .button-row .register-button { flex: 1 1 100%; transform: translateX(0px); }
.input-field-wrapper.valid + .button-row .register-button { border-color: rgb(110, 158, 150); border-width: 2px; background: rgb(212, 210, 210); color: rgb(44, 35, 46); font-weight: 600; }
.button-row { display: flex; gap: 8px; margin-top: 10px; }
.button-row .create-button { flex: 1 1 0%; width: auto; }
.button-row .register-button { background: rgb(212, 210, 210); color: rgb(44, 35, 46); border: 1px solid rgb(44, 35, 46); }
.button-row .register-button img { height: 27px; width: auto; }
.hero-headline { margin-bottom: 16px; padding-top: 5px; padding-left: 10px; }
.headline-word { display: block; color: rgb(255, 255, 255); text-transform: uppercase; letter-spacing: 0.06em; }
.headline-word.bold { font-family: SharpGroteskBold25, Inter, sans-serif; }
.headline-word.thin { font-family: HarrietDisplayThin, "Times New Roman", serif; }
.headline-word { font-size: clamp(42px, 12.5vw, 58px); line-height: 1; }
.logo-ticker { width: 100%; overflow: hidden; margin-bottom: 16px; mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%); }
.logo-strip { display: flex; gap: 40px; align-items: center; animation: 36s linear 0s infinite normal none running logo-scroll; will-change: transform; flex-wrap: nowrap; min-width: max-content; }
.logo-item { font-size: 18px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255, 255, 255, 0.92); padding: 0px; white-space: nowrap; display: flex; align-items: center; font-family: HarrietDisplayThin, "Times New Roman", serif; }
.logo-item strong { font-weight: 600; letter-spacing: 0.04em; }
.logo-item.apple { letter-spacing: 0.08em; }
.logo-item.apple::before { content: ""; font-size: 22px; margin-right: 6px; }
@keyframes logo-scroll { 
  0% { transform: translateX(0px); }
  100% { transform: translateX(-50%); }
}
.create-button { background: rgb(44, 35, 46); color: rgb(255, 255, 255); border-width: medium; border-style: none; border-color: currentcolor; border-image: none; padding: 8px 24px; font-size: 16px; font-weight: 500; border-radius: 100px; cursor: pointer; width: 100%; min-height: 54px; transition: transform 0.2s, flex 0.3s, max-width 0.3s; margin-bottom: 12px; font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; }
.create-button:active { transform: scale(0.98); }
.create-button:disabled { opacity: 0.6; cursor: not-allowed; }
.create-button img { height: 27px; width: auto; object-fit: contain; flex-shrink: 0; }
#status { margin-top: 10px; min-height: 1px; }</style>
