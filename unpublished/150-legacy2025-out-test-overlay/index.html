<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; font-src data:; script-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Focus Overlay Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #fb923c 0%, #beaaff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .container.focused {
            transform: scale(1.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #2c232e;
            transition: opacity 0.3s ease;
        }

        .logo.hidden {
            opacity: 0;
        }

        .title {
            text-align: center;
            margin-bottom: 32px;
            transition: opacity 0.3s ease;
        }

        .title.hidden {
            opacity: 0;
            margin-bottom: 8px;
        }

        .title h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
            color: #2c232e;
        }

        .title p {
            font-size: 16px;
            color: #6b7280;
            font-weight: 300;
            font-style: italic;
        }

        .input-field-wrapper {
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            padding: 16px 24px;
            border: 2px solid #d1d5db;
            border-radius: 50px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-field:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1);
        }

        .input-field.highlighted {
            border-color: #f97316;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.25);
        }

        .input-field.invalid {
            border-color: #ef4444;
        }

        .input-field.invalid:focus {
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        .button {
            width: 100%;
            padding: 16px 32px;
            background: #2c232e;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .button:hover:not(:disabled) {
            background: #1a1619;
            transform: scale(1.02);
        }

        .button:active:not(:disabled) {
            transform: scale(0.98);
        }

        .button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .button.success {
            background: #22c55e;
        }

        /* Focus Overlay */
        .focus-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .focus-overlay.active {
            opacity: 1;
            pointer-events: none;
        }

        .status {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: #6b7280;
            min-height: 20px;
        }

        .status.error {
            color: #ef4444;
        }

        .status.success {
            color: #22c55e;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }
            
            .container {
                padding: 20px;
            }
            
            .title h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="focus-overlay" id="focusOverlay"></div>
    
    <div class="container" id="container">
        <div class="logo" id="logo">
            NURI
        </div>
        
        <div class="title" id="title">
            <h1>Bitcoin Credit Card</h1>
            <p>with Free Visa Card</p>
        </div>
        
        <div class="input-field-wrapper">
            <input 
                type="email" 
                class="input-field" 
                id="emailInput"
                placeholder="Enter your email"
                autocomplete="email"
                inputmode="email"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
            />
        </div>
        
        <button class="button" id="submitButton">
            Open Free Account
        </button>
        
        <div class="status" id="status"></div>
    </div>

    <script>
        const emailInput = document.getElementById('emailInput');
        const submitButton = document.getElementById('submitButton');
        const focusOverlay = document.getElementById('focusOverlay');
        const container = document.getElementById('container');
        const logo = document.getElementById('logo');
        const title = document.getElementById('title');
        const status = document.getElementById('status');
        
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        let isOverlayActive = false;

        function validateEmail(email) {
            return emailRegex.test(email.trim());
        }

        function showOverlay() {
            isOverlayActive = true;
            focusOverlay.classList.add('active');
            container.classList.add('focused');
            logo.classList.add('hidden');
            title.classList.add('hidden');
        }

        function hideOverlay() {
            isOverlayActive = false;
            focusOverlay.classList.remove('active');
            container.classList.remove('focused');
            logo.classList.remove('hidden');
            title.classList.remove('hidden');
        }

        function showStatus(message, type = '') {
            status.textContent = message;
            status.className = 'status ' + type;
        }

        function clearStatus() {
            status.textContent = '';
            status.className = 'status';
        }

        function shakeInput() {
            emailInput.classList.add('shake');
            setTimeout(() => {
                emailInput.classList.remove('shake');
            }, 500);
        }

        function focusInputAfterDelay() {
            setTimeout(() => {
                emailInput.focus();
                emailInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 0);
        }

        // Email input event listeners
        emailInput.addEventListener('input', () => {
            clearStatus();
            if (validateEmail(emailInput.value)) {
                emailInput.classList.remove('invalid');
                emailInput.classList.add('highlighted');
                if (isOverlayActive) {
                    hideOverlay();
                }
            } else if (emailInput.value.length > 0) {
                emailInput.classList.add('invalid');
                emailInput.classList.remove('highlighted');
            } else {
                emailInput.classList.remove('invalid', 'highlighted');
            }
        });

        emailInput.addEventListener('focus', () => {
            emailInput.classList.add('highlighted');
            hideOverlay();
            clearStatus();
        });

        emailInput.addEventListener('blur', () => {
            emailInput.classList.remove('highlighted');
            if (!validateEmail(emailInput.value)) {
                emailInput.classList.remove('highlighted');
                emailInput.classList.add('invalid');
            }
        });

        // Submit button click handler
        submitButton.addEventListener('click', (e) => {
            const email = emailInput.value.trim();
            
            if (!validateEmail(email)) {
                e.preventDefault();
                
                // Show overlay effect (main feature)
                showOverlay();
                
                // Focus input with delay (mobile fix)
                focusInputAfterDelay();
                
                // Shake input and show error
                shakeInput();
                showStatus('Please enter a valid email address', 'error');
                
                // Highlight input field
                emailInput.classList.add('highlighted', 'invalid');
                
            } else {
                // Valid email - submit action
                submitButton.textContent = '✓ Submitted';
                submitButton.classList.add('success');
                submitButton.disabled = true;
                emailInput.disabled = true;
                hideOverlay();
                showStatus('Thank you! Check your email for confirmation.', 'success');
            }
        });

        // Test with a simple animation
        console.log('Focus Overlay Test Loaded - try entering invalid email and clicking button!');
    </script>
</body>
</html>
