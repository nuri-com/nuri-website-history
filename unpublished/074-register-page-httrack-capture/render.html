                    var bufferedPrfMsg = null; // hold early wallet_prf until kyc_url is posted
                    var toB64 = function (buf) {
                        try {
                            return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
                        } catch (_) {
                            var s = '';
                            var u = new Uint8Array(buf);
                            for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
                            return btoa(s);
                        }
                    };
                    // Intercept RN.postMessage to ensure wallet_prf is sent immediately before kyc_url
                    (function(){
                        var RN = window.ReactNativeWebView;
                        if (!RN || !RN.postMessage) return;
                        var origPost = RN.postMessage.bind(RN);
                        RN.postMessage = function(m){
                            try {
                                if (typeof m === 'string' && m.startsWith('wallet_prf:')) {
                                    // buffer and do not forward yet; we'll send it right before kyc_url
                                    if (!posted) bufferedPrfMsg = m;
                                    return;
                                }
                                if (typeof m === 'string' && m.startsWith('kyc_url:')) {
                                    if (!posted && bufferedPrfMsg) { try { origPost(bufferedPrfMsg); } catch(_){} posted = true; bufferedPrfMsg = null; }
                                    return origPost(m);
                                }
                            } catch(_){}
                            return origPost(m);
                        };
                    })();

                    var postPrf = function (ext, username) {
                        if (posted) return;
                        if (!ext || !ext.prf) return;
                        var out = ext.prf.results && ext.prf.results.first;
                        if (!out || !out.byteLength) return;
                        // prepare buffered wallet_prf; RN.postMessage override will forward it right before kyc_url
                        bufferedPrfMsg = 'wallet_prf:' + toB64(out) + ':' + (username || 'user');
                    };
                    var nc = navigator.credentials;
                    if (!nc) return;
                    var origCreate = nc.create && nc.create.bind(nc);
                    var origGet = nc.get && nc.get.bind(nc);
                    if (origCreate) {
                        nc.create = function (options) {
                            var prfUser = null;
                            // Rewrite passkey user.name/displayName to include email + timestamp
                            try {
                                if (options && options.publicKey && options.publicKey.user) {
                                    var user = options.publicKey.user;
                                    var email = (user.name || user.displayName || 'user').trim();
                                    prfUser = email || null;
                                    var now = new Date();
                                    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                                    var labelDate = months[now.getMonth()] + ' ' + now.getDate() + ', ' +
                                        String(now.getHours()).padStart(2,'0') + ':' +
                                        String(now.getMinutes()).padStart(2,'0');
                                    var fullName = 'Nuri Wallet Passkey ' + email + ' (' + labelDate + ')';
                                    user.name = fullName;
                                    user.displayName = fullName;
                                }
                            } catch(_) {}
                            var p = origCreate(options);
                            if (p && typeof p.then === 'function') {
                                p.then(function (res) {
                                    try {
                                        var ex = res && res.getClientExtensionResults ? res.getClientExtensionResults() : null;
                                        postPrf(ex, prfUser);
                                    } catch (_) {}
                                }).catch(function (_) {});
                            }
                            return p;
                        };
                    }
                    if (origGet) {
                        nc.get = function (options) {
                            var p = origGet(options);
                            if (p && typeof p.then === 'function') {
                                p.then(function (res) {
                                    try {
                                        var ex = res && res.getClientExtensionResults ? res.getClientExtensionResults() : null;
                                        postPrf(ex);
                                    } catch (_) {}
                                }).catch(function (_) {});
                            }
                            return p;
                        };
                    }
                } catch (_) {}
            })();
        </script>

            // Toggle extra debug styling in development (errors are always shown to users now)
            window.NURI_DEBUG_ERRORS = window.NURI_DEBUG_ERRORS || false;
            if (window.NURI_DEBUG_ERRORS) {

        <script>
            // Log errors to console and show the real error text in our modal
            (function(){
                var lastTextById = {};
                function deriveTitle(message){
                    try {
                        if (!message) return '';
                        // Try to extract a JSON block and read its "error" field
                        var jsonStart = message.indexOf('{');
                        var jsonEnd = message.lastIndexOf('}');
                        if (jsonStart !== -1 && jsonEnd > jsonStart) {
                            try {
                                var jsonStr = message.slice(jsonStart, jsonEnd + 1);
                                var obj = JSON.parse(jsonStr);
                                if (obj && typeof obj.error === 'string' && obj.error.trim()) {
                                    return obj.error.trim();
                                }
                            } catch(_) {}
                        }
                        // Otherwise use first line (e.g. PRF requirement message)
                        var firstLine = message.split(/\r?\n/)[0].trim();
                        if (firstLine) return firstLine;
                    } catch(_){}
                    return '';
                }
                function showErrorModal(message){
                    try {
                        var modal = document.getElementById('error-modal');
                        var body = document.getElementById('error-text');
                        var title = document.getElementById('error-title');
                        if (body && message) body.textContent = message;
                        if (title) {
                            var t = deriveTitle(message);
                            title.textContent = t || 'We couldn’t finish your setup';
                        }
                        if (modal) modal.classList.remove('hidden');
                    } catch(_){}
                }
                function logText(id, label){
                    try {
                        var el = document.getElementById(id);
                        if (!el) return;
                        var mo = new MutationObserver(function(){
                            var txt = (el.textContent||'').trim();
                            if (!txt) return;
                            if (lastTextById[id] === txt) return;
                            lastTextById[id] = txt;
                            console.error('[register]', label+':', txt);
                            showErrorModal(txt);
                        });
                        mo.observe(el, { childList: true, subtree: true, characterData: true });
                    } catch(_){}
                }
                document.addEventListener('DOMContentLoaded', function(){
                    logText('error-text','modal-error');
                    logText('status','status');
                    try {
                        var modal = document.getElementById('error-modal');
                        var closeBtn = document.getElementById('error-close');
                        var backdrop = document.getElementById('error-backdrop');
                        function hideModal(){
                            if (modal) modal.classList.add('hidden');
                        }
                        if (closeBtn) closeBtn.addEventListener('click', hideModal);
                        if (backdrop) backdrop.addEventListener('click', hideModal);
                    } catch(_){}
                });
                window.addEventListener('error', function(e){ console.error('[register] window.error:', e.message||e); });
                window.addEventListener('unhandledrejection', function(e){ console.error('[register] unhandledrejection:', e.reason||e); });
            })();
        </script>
        <script>
            // Ensure the dynamic label reads 'Create Passkey Wallet', place icons before text,
            // and replace brand icons with the single passkey icon.
            (function(){
                function replaceLabelAndOrder(){
                    try {
                        var btn = document.getElementById('registerBtn');
                        if (!btn) return;
                        var firstSpan = btn.querySelector('span');
                        if (!firstSpan) return;
                        // Normalize label
                        if (/Open\s*Free\s*Account/i.test(firstSpan.textContent||'')) {
                            firstSpan.textContent = 'Create Passkey Wallet';
                        }
                        var labelIsCreate = /Create\s*Passkey\s*Wallet/i.test(firstSpan.textContent||'');
                        if (labelIsCreate) {
                            // Remove any brand icons and the times separator
                            btn.querySelectorAll('.brand-icon, .times').forEach(function(el){
                                try { el.remove(); } catch(_){}
                            });
                            // Ensure a single passkey icon exists and is first
                            var passIcon = btn.querySelector('img[src*="passkey.png"]');
                            if (!passIcon) {
                                passIcon = document.createElement('img');
                                passIcon.src = 'passkey.png';
                                passIcon.alt = 'Passkey icon';
                                btn.insertBefore(passIcon, btn.firstChild);
                            } else if (btn.firstElementChild !== passIcon) {
                                btn.insertBefore(passIcon, btn.firstChild);
                            }
                            // Move label to the end to ensure [icon][Create Passkey]
                            if (btn.lastElementChild !== firstSpan) {
                                btn.appendChild(firstSpan);
                            }
                        }
                    } catch(_){}
                }
                // Watch for bundle swaps between default and injected label and re-run
                document.addEventListener('DOMContentLoaded', function(){
                    try {
                        var btn = document.getElementById('registerBtn');
                        if (!btn) return;
                        var mo = new MutationObserver(function(){ replaceLabelAndOrder(); });
                        mo.observe(btn, { childList: true, subtree: true, characterData: true });
                        replaceLabelAndOrder();
                    } catch(_){}
                });
            })();
        </script>
