<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; font-src data:; script-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Gnosis Pay Card Display</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, system-ui, sans-serif;
            background: #f5f5f5;
        }
        #container {
            min-height: 400px;
            background: white;
            border-radius: 12px;
            padding: 20px;
        }
        .loading {
            text-align: center;
            color: #666;
            padding: 40px;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
    <meta name="robots" content="noindex, nofollow" />
</head>
<body>
    <div id="container">
        <div class="loading">Loading secure card display...</div>
    </div>

    <script type="module">
        import GPSDK from "https://unpkg.com/@gnosispay/pse-sdk@1.2.2/dist/gp-sdk.es.js";

        const el = (sel) => document.querySelector(sel);
        const setError = (msg) => {
            el('#container').innerHTML = `<div class="error">${msg}</div>`;
        };

        // Get parameters from URL
        const params = new URLSearchParams(window.location.search);
        const appId = params.get('appId');
        let ephemeralToken = params.get('ephemeralToken');
        const jwt = params.get('jwt');
        const cardToken = params.get('cardToken');

        console.log('PSE Card Display loaded with params:');
        console.log('  appId:', appId);
        console.log('  cardToken:', cardToken);
        console.log('  Has ephemeralToken:', !!ephemeralToken);
        console.log('  Has JWT:', !!jwt);

        async function ensureEphemeralToken() {
            if (ephemeralToken) return ephemeralToken;
            try {
                const resp = await fetch('/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (!resp.ok) throw new Error(`Token request failed: ${resp.status}`);
                const data = await resp.json();
                // Support both shapes from backend
                ephemeralToken = data?.data?.ephemeralToken || data?.responseObject?.data?.ephemeralToken;
                console.log('Fetched ephemeral token:', !!ephemeralToken);
                return ephemeralToken;
            } catch (e) {
                console.error('Error fetching ephemeral token', e);
                throw e;
            }
        }

        (async () => {
            try {
                if (!jwt || !cardToken) {
                    setError('Missing required parameters. Please close and try again.');
                    return;
                }

                await ensureEphemeralToken();

                // Initialize PSE SDK
                const gp = new GPSDK({
                    appId: appId || 'gp_625617509d0d65de658e71b0e8c2cb0a',
                    ephemeralToken,
                    gnosisPayApiAuthToken: jwt
                });

                console.log('GPSDK instance created');

                // Clear loading message
                const loading = document.querySelector('.loading');
                if (loading) loading.style.display = 'none';

                // This creates the secure iframe
                const result = gp.init(
                    GPSDK.ElementType?.CardData || 'CardData',
                    "#container",
                    { cardToken }
                );

                console.log('PSE iframe initialized:', result);

                // Notify parent window if in iframe/WebView
                if (window.parent !== window || window.ReactNativeWebView) {
                    const message = { type: 'pse_initialized', success: true };

                    if (window.ReactNativeWebView) {
                        window.ReactNativeWebView.postMessage(JSON.stringify(message));
                    } else {
                        window.parent.postMessage(message, '*');
                    }
                }

                // Check for iframe after delay
                setTimeout(() => {
                    const iframes = document.querySelectorAll('iframe');
                    console.log('Iframes created:', iframes.length);
                    iframes.forEach(iframe => {
                        console.log('Iframe src:', iframe.src);
                    });
                }, 1000);
            } catch (error) {
                console.error('Failed to initialize PSE:', error);
                setError('Failed to load card display: ' + (error?.message || error));

                if (window.ReactNativeWebView) {
                    window.ReactNativeWebView.postMessage(JSON.stringify({
                        type: 'error',
                        message: error?.message || String(error)
                    }));
                }
            }
        })();
    </script>
</body>
</html>
