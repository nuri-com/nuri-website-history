<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; font-src data:; script-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex,nofollow,noarchive">

  <!-- DS Styles — generated tokens + shell + typography -->

  <link rel="stylesheet" href="ds/namespaces/typography.css" />

  <link rel="stylesheet" href="ds/factory/reset.css" />

  <!-- Primitive CSS -->
  <link rel="stylesheet" href="ds/primitives/dock/dock.css" />

  <link rel="stylesheet" href="screens/shared/sheet-styles.css" />
  <link rel="stylesheet" href="screens/bitcoin/button-fix.css" />

  <!-- Theme vor first paint setzen -->
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('nuri:theme') || 'light';
    document.documentElement.dataset.neutral = 'cream';
    document.documentElement.dataset.accent = localStorage.getItem('nuri:accent') || 'neutral';
  </script>

  <style>
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    #app { min-height: 100vh; }
    #app:empty::before {
      content: "Loading…";
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #999;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="app.js"></script>
</body>
